<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Star glow (white/cream for dark bg) -->
    <radialGradient id="starGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5e6" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f0dfc8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0dfc8" stop-opacity="0"/>
    </radialGradient>
    <!-- Light streak gradient (lighter for dark bg) -->
    <linearGradient id="streakGradDark" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff5e6" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f0dfc8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#e0cfb8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d0bfaa" stop-opacity="0"/>
    </linearGradient>
    <!-- Star center gradient -->
    <radialGradient id="starCenterDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#f0dfc8"/>
    </radialGradient>
  </defs>

  <!-- Soft halo glow -->
  <circle cx="60" cy="60" r="42" fill="url(#starGlowDark)" opacity="0.3"/>

  <!-- Ring (cream/white for dark bg) -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#f5ede0" stroke-width="7" stroke-linecap="round"/>

  <!-- Horizontal light streak -->
  <rect x="60" y="57" width="58" height="6" rx="3" fill="url(#streakGradDark)"/>

  <!-- Star / sparkle -->
  <g transform="translate(60, 60)">
    <ellipse cx="0" cy="0" rx="2.8" ry="12" fill="url(#starCenterDark)"/>
    <ellipse cx="0" cy="0" rx="12" ry="2.8" fill="url(#starCenterDark)"/>
    <ellipse cx="0" cy="0" rx="2" ry="7" fill="url(#starCenterDark)" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="2" ry="7" fill="url(#starCenterDark)" transform="rotate(-45)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
</svg>
