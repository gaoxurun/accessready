<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccessReady — Scan to Visit</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d4 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.5rem;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 {
      font-size: 1.5rem;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0 2rem;
      padding: 1.5rem;
      background: #faf8f5;
      border-radius: 16px;
    }
    #qrcode img, #qrcode canvas {
      border-radius: 8px;
    }
    .url-box {
      background: #f5f0e8;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1.5rem;
      word-break: break-all;
      font-size: 0.8rem;
      color: #666;
      font-family: 'Courier New', monospace;
    }
    .url-label {
      font-size: 0.7rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .tip {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
    .tip i { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="images/logo-mark.svg" alt="AccessReady Logo">
    </div>
    <h1>AccessReady Platform</h1>
    <div class="subtitle">Scan QR Code to Visit</div>
    <div id="qrcode"></div>
    <div class="url-box">
      <div class="url-label">Website URL</div>
      <div id="url-text">Loading...</div>
    </div>
    <div class="tip">📱 手机扫码即可访问网站</div>
  </div>

  <script>
    // URL will be set when the tunnel is ready
    var publicUrl = 'https://illustrious-naiad-83d991.netlify.app';

    function generateQR(url) {
      document.getElementById('url-text').textContent = url;
      var qrcode = new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 220,
        height: 220,
        colorDark: "#1a1a1a",
        colorLight: "#faf8f5",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // If URL is set, generate immediately
    if (publicUrl && publicUrl !== 'PENDING' && publicUrl.startsWith('http')) {
      generateQR(publicUrl);
    } else {
      document.getElementById('qrcode').innerHTML = '<p style="color:#999;font-size:0.85rem;">Waiting for tunnel connection...</p>';
    }
  </script>
</body>
</html>
